name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The core on Windows: its unit tests, then the system tests against the real Windows of the
  # runner (which is elevated): processes, windows, a real service, permissions, shortcuts.
  core:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check

      - run: cargo clippy -p lockstep-core --all-targets -- -D warnings

      - name: Unit and system tests
        run: cargo test -p lockstep-core -- --include-ignored --test-threads=1
